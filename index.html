<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessibilidade - Guia de Áudio</title>

    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <script src="./script.js"></script>
</head>
<body>

<div class="container">
    <section class="audio-container">
        <h1 class="titulo-audio" id="titulo-pagina">Carregando...</h1>
        <p class="status" id="status-audio">Buscando informações do ambiente...</p>
    
        <audio id="audio" controls>
            <source id="fonte-audio" src="" type="audio/mpeg">
            Seu navegador não suporta a reprodução de áudio.
        </audio>

        <!-- Para teste no ambiente de desenvolvimento -->
        <!-- <a href="index.html?id=assintotas">Mudar URL</a> -->
    </section>

    <section class="chat-container" aria-label="Assistente de Dúvidas sobre o Gráfico">
        <h2 class="titulo-agente">Tirar dúvidas por áudio</h2>
        <p class="descricao-agente">Clique no botão abaixo e tire dúvidas com o nosso agente de IA sobre este gráfico.</p>

        <div id="esfera-ia" class="esfera-ia"></div>

        <div class="chat-controles">
            <button id="btn-gravacao" class="btn-audio" aria-label="Gravar pergunta em áudio">
                Gravar pergunta
            </button>
            <!-- Região que lê o estado da gravação para o leitor de tela sem interromper o usuário -->
            <span id="status-gravacao" class="leitor" aria-live="assertive"></span>
        </div>
    </section>
</div>

</body>
</html>
